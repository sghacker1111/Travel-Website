name: Deploy to InfinityFree

on:
  push:
    branches:
      - main

jobs:
  ftp-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: FTP Upload Deploy
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: topmountain.is-great.org/htdocs/
          # Skip uploading Git files and documentation
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            scratch/**
            scripts/**
            data/recovery_otp.txt
